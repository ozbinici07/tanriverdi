const frame=document.getElementById('view');
const loading=document.getElementById('loading');
const tabs=document.getElementById('adminTabs');
const tabButtons=[...document.querySelectorAll('.admin-tab')];
let currentMode='';
let adminTab='admin';
function decode(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
// Preserve existing administrator sessions when upgrading to persistent storage.
try {
  const previousAdminSession=sessionStorage.getItem('tanriverdi_admin_session');
  if(previousAdminSession && !localStorage.getItem('tanriverdi_admin_session')) localStorage.setItem('tanriverdi_admin_session',previousAdminSession);
  sessionStorage.removeItem('tanriverdi_admin_session');
} catch(error) { console.warn('Yönetici oturumu taşınamadı:',error); }
function session(){try{const a=localStorage.getItem('tanriverdi_admin_session');if(a){const s=JSON.parse(a);if(isAdmin(s))return s;}const c=JSON.parse(localStorage.getItem('tanriverdi_logged_user')||'null');return isAdmin(c)?null:c;}catch(e){return null}}
function isAdmin(s){return !!s&&(s.role==='admin'||s.rol==='admin'||s.yetki==='admin'||s.isAdmin===true)}
function setTabs(show){tabs.classList.toggle('show',show);frame.classList.toggle('admin-view',show)}
function setActive(tab){tabButtons.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function loadEmbedded(src,mode,showTabs){currentMode=mode;setTabs(showTabs);loading.classList.remove('hide');frame.srcdoc=src;}
let tanriverdiPushModule = null;
let tanriverdiPushBusy = false;
async function tanriverdiLoadPushModule(){
  if(!tanriverdiPushModule) tanriverdiPushModule = await import('./push.js');
  return tanriverdiPushModule;
}
window.tanriverdiEnableAdminPush = async function(){
  if(tanriverdiPushBusy) return {ok:false,busy:true};
  tanriverdiPushBusy = true;
  window.tanriverdiPushStatus = 'registering';
  updatePushButton();
  try{
    if(!('Notification' in window)) throw new Error('Bildirim desteği yok');
    if(Notification.permission==='default') await Notification.requestPermission();
    if(Notification.permission!=='granted') throw new Error('Bildirim izni verilmedi');
    const m = await tanriverdiLoadPushModule();
    const token = await m.enableAdminPush();
    window.tanriverdiPushStatus = 'enabled';
    return {ok:true,token};
  }catch(e){
    console.warn('FCM kayıt/izin:', e);
    window.tanriverdiPushStatus = 'error';
    return {ok:false,error:String(e.message||e)};
  }finally{ tanriverdiPushBusy=false; updatePushButton(); }
};
window.tanriverdiDisableAdminPush = async function(){
  try{ const m=await tanriverdiLoadPushModule(); await m.disableAdminPush(); }catch(e){ console.warn('FCM kapatma:',e); }
  window.tanriverdiPushStatus='disabled';
};
window.tanriverdiPrepareCustomerPush = async function(customerInfo={}){
  try{
    if(!('Notification' in window)) throw new Error('Bildirim desteği yok');
    // Bu çağrı müşteri sipariş butonunun kullanıcı etkileşimi zincirinde yapılır.
    // Böylece Android/iOS Web Push izin penceresi doğru şekilde açılabilir.
    let permission = Notification.permission;
    if(permission === 'default') permission = await Notification.requestPermission();
    if(permission !== 'granted') throw new Error('Bildirim izni verilmedi');
    const m=await tanriverdiLoadPushModule();
    const appBase = new URL('./', location.href).href;
    const deviceId = customerInfo.deviceId || '';
    return await m.enableCustomerPush({permissionGranted:true, customerInfo, deviceId, swUrl:new URL('sw.js',appBase).href, swScope:appBase});
  }catch(e){ console.warn('Müşteri FCM kayıt/izin:',e); return null; }
};
window.tanriverdiNotifyOrderStatus = async function(orderId,status){
  const url = (localStorage.getItem('tanriverdi_push_sender_url') || 'https://tanriverdi-fcm.ozbinici07.workers.dev/notify').trim();
  if(!url || !orderId || !status) return {ok:false,skipped:true};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({orderId:String(orderId),status:String(status)})});
    if(!r.ok) throw new Error('FCM Worker HTTP '+r.status);
    return await r.json();
  }catch(e){ console.warn('Müşteri durum bildirimi gönderilemedi:',e); return {ok:false,error:String(e.message||e)}; }
};
window.tanriverdiNotifyNewOrder = async function(orderId){
  const url = (localStorage.getItem('tanriverdi_push_sender_url') || 'https://tanriverdi-fcm.ozbinici07.workers.dev/notify').trim();
  if(!url || !orderId) return {ok:false, skipped:true};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({orderId:String(orderId)})});
    if(!r.ok) throw new Error('FCM Worker HTTP '+r.status);
    return await r.json();
  }catch(e){ console.warn('FCM bildirim gönderilemedi:',e); return {ok:false,error:String(e.message||e)}; }
};
async function tanriverdiAutoPush(){
  try{
    const s=session();
    if(isAdmin(s) && 'Notification' in window && Notification.permission==='granted') await window.tanriverdiEnableAdminPush();
  }catch(e){ console.warn('FCM otomatik kayıt:',e); }
}

const pushBtn=document.getElementById('pushBtn');
function updatePushButton(){
  if(!pushBtn) return;
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  if(perm==='granted' && window.tanriverdiPushStatus==='enabled'){pushBtn.textContent='🔔 Bildirimler Açık';pushBtn.classList.add('ok');pushBtn.classList.remove('warn');}
  else if(window.tanriverdiPushStatus==='registering'){pushBtn.textContent='🔔 Bildirimler Bağlanıyor';pushBtn.classList.remove('ok');pushBtn.classList.remove('warn');}
  else if(perm==='granted'){pushBtn.textContent=window.tanriverdiPushStatus==='error'?'⚠️ Bildirim Bağlantısını Yenile':'🔔 Bildirim Cihazını Kaydet';pushBtn.classList.remove('ok');pushBtn.classList.add('warn');}
  else if(perm==='denied'){pushBtn.textContent='🔕 Bildirim İzni Kapalı';pushBtn.classList.add('warn');pushBtn.classList.remove('ok');}
  else {pushBtn.textContent='🔔 Bildirimleri Aç';pushBtn.classList.remove('ok');pushBtn.classList.remove('warn');}
}
if(pushBtn) pushBtn.addEventListener('click',async()=>{
  if(!isAdmin(session())) return;
  const r=await window.tanriverdiEnableAdminPush();
  updatePushButton();
  if(r.ok) alert('Yönetici bildirimleri açıldı.');
  else if(r.error) alert('Bildirimler açılamadı: '+r.error);
});
updatePushButton();
function loadAccordingToSession(){const s=session();if(isAdmin(s)){setActive(adminTab);loadEmbedded(adminTab==='admin'?decode(ADMIN_B64):decode(CUSTOMER_B64),'admin-'+adminTab,true);tanriverdiAutoPush()}else{setTabs(false);loadEmbedded(decode(CUSTOMER_B64),'customer',false)}}
tabButtons.forEach(btn=>btn.addEventListener('click',()=>{if(!isAdmin(session()))return;adminTab=btn.dataset.tab;setActive(adminTab);loadEmbedded(adminTab==='admin'?decode(ADMIN_B64):decode(CUSTOMER_B64),'admin-'+adminTab,true)}));
frame.addEventListener('load',()=>loading.classList.add('hide'));
frame.addEventListener('error',()=>{loading.textContent='Tanrıverdi Döner açılamadı.'});
window.addEventListener('storage',()=>{const s=session();if(!isAdmin(s)&&currentMode!=='customer')loadAccordingToSession();else if(isAdmin(s)&&currentMode==='customer')loadAccordingToSession()});
window.addEventListener('message',e=>{if(e.data&&e.data.type==='tanriverdi-logout'){try{localStorage.removeItem('tanriverdi_admin_session')}catch(_){}loadAccordingToSession()}if(e.data&&e.data.type==='tanriverdi-admin-login')loadAccordingToSession()});
loadAccordingToSession();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script src="./account-view.js"></script>
</body>
</html>
